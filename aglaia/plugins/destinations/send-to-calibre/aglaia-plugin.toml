[plugin]
slug     = "send-to-calibre"
name     = "Export to Calibre server"
version  = "1.0.0"
summary  = "Add a finished export to a Calibre content server's library."
author   = "Aglaïa <aglaia@bibli.cc>"
homepage = "https://aglaia.bibli.cc"
license  = "MIT"
entry    = "send_to_calibre.py"

[requires]
aglaia  = ">=0.1.0rc5,<0.2"
python  = ">=3.12"
api     = 1
imports = ["httpx"]

[capabilities]
config  = true
secrets = true
network = true
files   = false
